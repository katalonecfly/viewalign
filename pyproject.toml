[project]
name = "viewalign"
version = "0.9.1"
description = "Align photos from approximately the same viewpoint and create derived visualizations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
viewalign = "viewalign.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
